    <style>
        :root {
            --bg: #05070a;
            --panel: rgba(12, 16, 20, 0.72);
            --fg: #cfe9df;
            --dim: #5f7168;
            --green: #5ffba3;
            --cyan: #7fdfff;
            --pink: #ff6ea9;
            --sakura: #ffb7d5;
            --purple: #c9a2ff;
            --amber: #ffcf5c;
            --red: #ff5f6e;
            --border: rgba(127, 223, 255, 0.14);
            --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            --glow: 0 0 6px rgba(95, 251, 163, 0.25);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        html, body { height: 100%; }

        body {
            background: var(--bg);
            color: var(--fg);
            font-family: var(--mono);
            font-size: 15px;
            line-height: 1.55;
            overflow: hidden;
            position: relative;
        }

        /* background radial + matrix canvas */
        #matrix { position: fixed; inset: 0; z-index: 0; opacity: 0; transition: opacity 0.6s; pointer-events: none; }
        #matrix.on { opacity: 0.5; }
        body::before {
            content: "";
            position: fixed; inset: 0; z-index: 0; pointer-events: none;
            background:
                radial-gradient(1000px 600px at 50% -10%, rgba(201, 162, 255, 0.12), transparent 60%),
                radial-gradient(820px 520px at 100% 110%, rgba(255, 183, 213, 0.10), transparent 60%),
                radial-gradient(700px 480px at 0% 60%, rgba(127, 223, 255, 0.07), transparent 60%);
        }

        /* sakura petals */
        #sakura { position: fixed; inset: 0; z-index: 40; pointer-events: none; overflow: hidden; }
        .petal {
            position: absolute; top: -24px;
            width: 12px; height: 12px;
            background: radial-gradient(circle at 30% 30%, #ffd6e7, var(--sakura));
            border-radius: 12px 1px 12px 1px;
            opacity: 0.8;
            filter: drop-shadow(0 0 4px rgba(255, 183, 213, 0.6));
            animation: fall linear infinite;
        }
        @keyframes fall {
            0%   { transform: translateX(0) translateY(-24px) rotate(0deg); opacity: 0; }
            8%   { opacity: 0.85; }
            100% { transform: translateX(var(--drift, 60px)) translateY(105vh) rotate(540deg); opacity: 0.2; }
        }

        /* CRT scanlines + flicker + vignette */
        .crt {
            position: fixed; inset: 0; z-index: 50; pointer-events: none;
            background: repeating-linear-gradient(
                to bottom,
                rgba(0, 0, 0, 0) 0px,
                rgba(0, 0, 0, 0) 2px,
                rgba(0, 0, 0, 0.16) 3px,
                rgba(0, 0, 0, 0.16) 4px
            );
            mix-blend-mode: multiply;
        }
        .crt::after {
            content: "";
            position: absolute; inset: 0;
            box-shadow: inset 0 0 160px rgba(0, 0, 0, 0.9);
            animation: flicker 4.5s infinite steps(60);
        }
        @keyframes flicker { 0%,100% { opacity: 1; } 3% { opacity: 0.94; } 6% { opacity: 1; } 77% { opacity: 0.97; } 80% { opacity: 1; } }

        /* screen layout */
        .screen {
            position: relative; z-index: 10;
            height: 100%;
            display: flex; flex-direction: column;
            max-width: 940px;
            margin: 0 auto;
        }

        .titlebar {
            display: flex; align-items: center; gap: 0.6rem;
            padding: 0.6rem 1rem;
            border-bottom: 1px solid var(--border);
            background: var(--panel);
            backdrop-filter: blur(6px);
            font-size: 0.76rem; color: var(--dim);
            flex-shrink: 0;
        }
        .dots { display: flex; gap: 0.4rem; }
        .dots i { width: 11px; height: 11px; border-radius: 50%; display: inline-block; }
        .dots .r { background: #ff5f56; } .dots .y { background: #ffbd2e; } .dots .g { background: #27c93f; }
        .titlebar .ttl { color: var(--fg); }
        .titlebar .hint { margin-left: auto; color: var(--dim); }
        .titlebar .hint b { color: var(--cyan); }

        .term {
            flex: 1; overflow-y: auto;
            padding: 1.2rem 1.2rem 0.4rem;
            scrollbar-width: thin;
            scrollbar-color: rgba(127,223,255,0.25) transparent;
        }
        .term::-webkit-scrollbar { width: 8px; }
        .term::-webkit-scrollbar-thumb { background: rgba(127,223,255,0.2); border-radius: 4px; }

        .term, .term a { text-shadow: var(--glow); }

        .line { white-space: pre-wrap; word-break: break-word; }
        .b { color: var(--fg); }
        .green { color: var(--green); } .cyan { color: var(--cyan); } .pink { color: var(--pink); }
        .amber { color: var(--amber); } .red { color: var(--red); } .dim { color: var(--dim); }
        .ascii { color: var(--cyan); line-height: 1.08; font-size: clamp(0.5rem, 2.1vw, 0.86rem); text-shadow: 0 0 10px rgba(127,223,255,0.4); }

        a { color: var(--green); text-decoration: none; border-bottom: 1px dotted rgba(95,251,163,0.4); }
        a:hover { color: var(--cyan); border-bottom-color: var(--cyan); }
        a.plain { border: none; }

        .cmd-echo .prompt { color: var(--green); }
        .cmd-echo .path { color: var(--cyan); }
        .cmd-echo .sep { color: var(--dim); }

        /* project rows */
        .prow { display: grid; grid-template-columns: 12.5rem 1fr; gap: 0 1rem; padding: 0.1rem 0; }
        .prow .pn a { color: var(--cyan); border: none; font-weight: 500; }
        .prow .pn a:hover { color: var(--green); text-shadow: 0 0 8px rgba(95,251,163,0.6); }
        .prow .pd { color: var(--dim); }
        .prow .pd .t { color: var(--pink); }
        @media (max-width: 620px) { .prow { grid-template-columns: 1fr; gap: 0; } .prow .pd { margin: 0 0 0.4rem; padding-left: 1.2rem; } }

        /* input line */
        .inputline {
            display: flex; align-items: center; gap: 0.5rem;
            padding: 0.1rem 0 1rem;
        }
        .inputline .ps1 { color: var(--green); flex-shrink: 0; }
        .inputline .ps1 .path { color: var(--cyan); }
        .inputline .ps1 .sep { color: var(--dim); }
        #cmd {
            flex: 1; background: transparent; border: none; outline: none;
            color: var(--fg); font-family: var(--mono); font-size: 15px;
            caret-color: var(--green); text-shadow: var(--glow);
        }

        /* quick chips */
        .chips {
            display: flex; flex-wrap: wrap; gap: 0.45rem;
            padding: 0.7rem 1.2rem 1rem;
            border-top: 1px solid var(--border);
            background: var(--panel);
            backdrop-filter: blur(6px);
            flex-shrink: 0;
        }
        .chip {
            font-family: var(--mono); font-size: 0.78rem;
            color: var(--cyan); background: rgba(127,223,255,0.05);
            border: 1px solid var(--border); border-radius: 7px;
            padding: 0.32rem 0.7rem; cursor: pointer; transition: all 0.18s;
            white-space: nowrap;
        }
        .chip:hover { background: rgba(127,223,255,0.14); color: var(--green); border-color: rgba(95,251,163,0.4); transform: translateY(-1px); }
        .chip.hot { color: var(--pink); border-color: rgba(255,110,169,0.35); }
        .chip.hot:hover { color: #fff; background: rgba(255,110,169,0.18); }

        .cursor-blk { display: inline-block; width: 9px; height: 1.05em; background: var(--green); vertical-align: text-bottom; animation: blink 1.05s steps(1) infinite; box-shadow: 0 0 8px var(--green); }
        @keyframes blink { 50% { opacity: 0; } }

        @media (max-width: 620px) { body { font-size: 13px; } #cmd { font-size: 13px; } .term { padding: 0.9rem 0.9rem 0.4rem; } }

        @media (prefers-reduced-motion: reduce) {
            .crt::after { animation: none; }
            .cursor-blk { animation: none; }
            #sakura { display: none; }
        }
    </style>
</head>

<body>
    <canvas id="matrix"></canvas>
    <div id="sakura" aria-hidden="true"></div>
    <div class="crt"></div>

    <div class="screen">
        <div class="titlebar">
            <span class="dots"><i class="r"></i><i class="y"></i><i class="g"></i></span>
            <span class="ttl">tazer@bihari: ~/portfolio — zsh <span style="color:var(--sakura)">タゼル ♥</span></span>
            <span class="hint">type <b>help</b> · or tap a chip ↓</span>
        </div>

        <div class="term" id="term" role="log" aria-live="polite">
            <div id="output"></div>
            <div class="inputline" id="inputline" style="display:none">
                <span class="ps1"><span class="path">tazer@bihari</span><span class="sep">:</span><span class="pink">~</span><span class="sep">$</span></span>
                <input id="cmd" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="terminal input">

        </div>

        <div class="chips" id="chips">
            <button class="chip" data-cmd="help">help</button>
            <button class="chip" data-cmd="about">about</button>

        </div>
    </div>

    <script>
    (function () {
        "use strict";
        var output = document.getElementById('output');
        var term = document.getElementById('term');
        var inputline = document.getElementById('inputline');
        var cmd = document.getElementById('cmd');
        var chips = document.getElementById('chips');
        var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        function esc(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
        function scroll() { term.scrollTop = term.scrollHeight; }
        function print(html) { var d = document.createElement('div'); d.className = 'line'; d.innerHTML = html; output.appendChild(d); scroll(); return d; }
        function blank() { print('&nbsp;'); }

        // ---------- data ----------
        var ASCII =
'  ████████╗ █████╗ ███████╗███████╗██████╗ \n' +
'  ╚══██╔══╝██╔══██╗╚══███╔╝██╔════╝██╔══██╗\n' +
'     ██║   ███████║  ███╔╝ █████╗  ██████╔╝\n' +
'     ██║   ██╔══██║ ███╔╝  ██╔══╝  ██╔══██╗\n' +
'     ██║   ██║  ██║███████╗███████╗██║  ██║\n' +
'     ╚═╝   ╚═╝  ╚═╝╚══════╝╚══════╝╚═╝  ╚═╝';

        var LINK = function (url, label) { return '<a href="' + url + '" target="_blank" rel="noopener noreferrer">' + esc(label || url) + '</a>'; };

        var PROJECTS = {
            security: [
                ['heckit', 'https://github.com/ajtazer/heckit', 'hacking buddy for AI coding agents — 291 offensive-sec skills', 'source'],
                ['ZAP-MCP', 'https://github.com/ajtazer/ZAP-MCP', 'MCP bridge so an AI can drive OWASP ZAP scans', '★23'],
                ['CVE-2025-51471', 'https://github.com/ajtazer/CVE-2025-51471-POC', 'Ollama cross-domain auth-token exposure — PoC', 'CVE'],
                ['docker-cp-escape', 'https://bihari.xyz/docker-cp-copyout-sibling-escape/', 'container escapes a docker cp copy-out race', 'writeup'],
                ['php857-cooked', 'https://github.com/ajtazer/php857-cookie-cooked', 'PHP 8.5.7 StreamBucket → SOAP RCE (repub. w/ permission)', 'RCE'],
                ['Shipd-CTF', 'https://github.com/ajtazer/Shipd-CTF-Chals', 'vuln-by-design CTF challenges w/ graders', 'CTF']
            ],
            tools: [
                ['curl-dump', 'https://dump.bihari.xyz/', 'curl a file up, wget it down — ephemeral, cloudflare', 'live'],
                ['wp-call', 'https://call.bihari.xyz/', 'video calls straight from WhatsApp Web', 'live ★3'],
                ['fekoyaha', 'https://feko.bihari.xyz/', 'instant no-signup chat + image rooms on the edge', 'live'],
                ['chota-link', 'https://s.bihari.xyz/', 'minimal, fast link shortener on cloudflare', 'live'],
                ['5g-finder', 'https://5g.bihari.xyz/', 'live 5G/4G signal strength over ADB, no root', 'live'],
                ['tazerchat', 'https://tazerchat.vercel.app/', 'tlk.io but the chats persist', 'live']
            ],
            fun: [
                ['bhaat', 'https://github.com/ajtazer/bhaat', 'my desktop rice — starship, spicetify, ccstatusline', 'dotfiles'],
                ['mangabrainrot', 'https://github.com/ajtazer/MangaBrainRot', 'MangaDex chapters → IG Reels w/ AI thumbnails', 'anime'],
                ['god-assist', 'https://github.com/ajtazer/god-assist', 'a claude-code plugin that narrates your agent', 'plugin']
            ]
        };

        function projectBlock(list) {
            var h = '';
            list.forEach(function (p) {
                h += '<div class="prow"><span class="pn">' + LINK(p[1], p[0]) +
                     '</span><span class="pd">' + esc(p[2]) + ' <span class="t">[' + esc(p[3]) + ']</span></span></div>';
            });
            return h;
        }

        // ---------- commands ----------
        var COMMANDS = {
            help: function () {
                print('<span class="green">available commands</span>');
                var rows = [
                    ['about', 'who is tazer'],
                    ['neofetch', 'system info + splash'],
                    ['projects', "what i've shipped   (alias: ls)"],
                    ['security', 'cves &amp; exploit pocs'],
                    ['anime', 'the other obsession'],
                    ['contact', 'reach me   (alias: socials)'],
                    ['resume', 'sudo hire-me'],
                    ['sakura', 'toggle the petals 🌸'],
                    ['matrix', 'toggle the katakana rain'],
                    ['clear', 'wipe the screen'],
                    ['banner', 'reprint the logo']
                ];
                rows.forEach(function (r) {
                    print('  <span class="cyan">' + r[0] + '</span>' + ' '.repeat(Math.max(1, 12 - r[0].length)) + '<span class="dim">' + r[1] + '</span>');
                });
                print('<span class="dim">tip: click a chip below, or type. ↑/↓ = history, tab = autocomplete.</span>');
            },
            about: function () {
                print("<span class='cyan'>Anuj Rawat</span> <span class='dim'>a.k.a</span> <span class='green'>TAZER</span> <span class='dim'>— security researcher, India.</span>");
                blank();
                print("I break things and then write up how. I hunt bugs, publish PoCs and the");
                print("occasional CVE, and ship an unreasonable number of small tools between");
                print("engagements. Off the clock: <span class='pink'>anime</span>, terminal <span class='cyan'>ricing</span>, and masti.");
                blank();
                print("<span class='dim'>keywords:</span> offensive security · web · cloud · container escapes · ADB · MCP");
            },
            neofetch: function () {
                print('<span class="ascii">' + ASCII + '</span>');
                print("<span class='sakura'>          ＼(＾▽＾)／  konnichiwa~  ·  security • anime • masti</span>");
                blank();
                var info = [
                    ['tazer', '@bihari.xyz', true],
                    ['role', 'offensive security · ethical hacker'],
                    ['os', "macOS, <span class='cyan'>riced like it's Arch</span>"],
                    ['shell', 'zsh + starship → ' + LINK('https://github.com/ajtazer/bhaat', 'bhaat')],
                    ['weapons', 'burp · zap · ghidra · a lot of curl'],
                    ['writing', 'CVEs · PoCs · sibling-dir escapes'],
                    ['anime', 'yes. a concerning amount.'],
                    ['since', '2004']
                ];
                info.forEach(function (r) {
                    if (r[2]) { print('<span class="green">' + r[0] + '</span><span class="dim">' + r[1] + '</span>'); print('<span class="dim">──────────────────────────</span>'); return; }
                    print('<span class="pink">' + r[0] + '</span>' + ' '.repeat(Math.max(1, 9 - r[0].length)) + '<span class="b">' + r[1] + '</span>');
                });
            },
            projects: function () {
                print('<span class="green"># security &amp; PoCs</span>'); print(projectBlock(PROJECTS.security));
                blank();
                print('<span class="green"># tools &amp; apps</span>'); print(projectBlock(PROJECTS.tools));
                blank();
                print('<span class="green"># anime &amp; rice</span>'); print(projectBlock(PROJECTS.fun));
                blank();
                print('<span class="dim">more at</span> ' + LINK('https://github.com/ajtazer', 'github.com/ajtazer'));
            },
            security: function () {
                print('<span class="green"># exploit dev, PoCs &amp; research</span>');
                print(projectBlock(PROJECTS.security));
                blank();
                print("<span class='dim'>disclosure-friendly. reports welcome over</span> " + LINK('/pgp/', 'PGP') + '.');
            },
            anime: function () {
                print('<span class="pink">アニメ // the other obsession.</span>');
                blank();
                print("<span class='sakura'>(づ｡◕‿‿◕｡)づ</span>  enrolled at <span class='cyan'>Koudo Ikusei Senior High School</span> (iykyk).");
                print("6 years deep on MyAnimeList, perpetually \"watching this season\".");
                blank();
                print("<span class='dim'>vibes:</span> psychological · slice-of-life · anything with a</span> <span class='pink'>menace-to-society protagonist</span>");
                print("<span class='dim'>list  →</span> " + LINK('https://myanimelist.net/profile/ajtazer', 'myanimelist.net/profile/ajtazer'));
                blank();
                print("<span class='dim'>psst — type</span> <span class='cyan'>matrix</span> <span class='dim'>for katakana rain, or</span> <span class='sakura'>sakura</span> <span class='dim'>for petals.</span>");
            },
            sakura: function () {
                var el = document.getElementById('sakura');
                if (el.style.display === 'none') { el.style.display = ''; print("<span class='sakura'>🌸 sakura: falling.</span>"); }
                else { el.style.display = 'none'; print("<span class='dim'>sakura: cleared. run</span> <span class='sakura'>sakura</span> <span class='dim'>to bring them back.</span>"); }
            },
            uwu: function () { print("<span class='sakura'>(⁄ ⁄•⁄ω⁄•⁄ ⁄)  n-nani?! this isn't a dating sim, senpai.</span>"); },
            waifu: function () { COMMANDS.uwu(); },
            contact: function () {
                var rows = [
                    ['github', 'https://github.com/ajtazer', 'github.com/ajtazer'],
                    ['linkedin', 'https://www.linkedin.com/in/tazer/', 'linkedin.com/in/tazer'],
                    ['instagram', 'https://www.instagram.com/anujrawatazer/', '@anujrawatazer'],
                    ['myanimelist', 'https://myanimelist.net/profile/ajtazer', 'myanimelist.net/profile/ajtazer'],
                    ['pgp', '/pgp/', 'encrypted mail →  /pgp/']
                ];
                rows.forEach(function (r) {
                    print('<span class="cyan">' + r[0] + '</span>' + ' '.repeat(Math.max(1, 13 - r[0].length)) + LINK(r[1], r[2]));
                });
                print('<span class="cyan">email</span>' + ' '.repeat(8) + '<a class="plain" href="mailto:me@bihari.xyz">me@bihari.xyz</a>');
            },
            resume: function () { COMMANDS['sudo hire-me'](); },
            'sudo hire-me': function () {
                print("<span class='green'>[sudo] password for tazer:</span> <span class='dim'>••••••••</span>");
                print("<span class='amber'>you don't need root for this. i'm open to work.</span>");
                blank();
                print("→ " + LINK('https://www.linkedin.com/in/tazer/', 'LinkedIn') + '  ·  ' + LINK('https://github.com/ajtazer', 'GitHub') + "  ·  <a class='plain' href='mailto:me@bihari.xyz'>me@bihari.xyz</a>");
                print("<span class='dim'>security roles, bug bounty, PoC work — let's talk.</span>");
            },
            socials: function () { COMMANDS.contact(); },
            ls: function () { COMMANDS.projects(); },
            whoami: function () { print('tazer'); print("<span class='dim'>(try</span> <span class='cyan'>about</span><span class='dim'>)</span>"); },
            banner: function () { print('<span class="ascii">' + ASCII + '</span>'); },
            clear: function () { output.innerHTML = ''; },
            matrix: function () {
                var on = MATRIX.toggle();
                print(on ? "<span class='green'>matrix: on.</span> <span class='dim'>run</span> <span class='cyan'>matrix</span> <span class='dim'>again to stop.</span>"
                         : "<span class='dim'>matrix: off.</span>");
            },
            exit: function () { print("<span class='dim'>there is no escape from tazerOS. (but you can close the tab.)</span>"); },
            sudo: function () { print("<span class='red'>tazer is not in the sudoers file. this incident has been reported.</span>"); }
        };

        var HELP_HINT = "<span class='dim'>type</span> <span class='cyan'>help</span> <span class='dim'>to see what i can do.</span>";

        function run(raw) {
            var input = (raw || '').trim();
            // echo
            var e = document.createElement('div');
            e.className = 'line cmd-echo';
            e.innerHTML = "<span class='prompt'>tazer@bihari</span><span class='sep'>:</span><span class='pink'>~</span><span class='sep'>$</span> " + esc(input);
            output.appendChild(e);
            if (!input) { scroll(); return; }

            var lower = input.toLowerCase();
            // easter eggs first
            if (/^sudo\s+rm\s+-rf|^rm\s+-rf/.test(lower)) {
                print("<span class='red'>rm: cannot remove '/': read-only container.</span>");
                print("<span class='dim'>nice try though. and you're not root here. 🙂</span>");
                scroll(); return;
            }
            if (lower === 'sudo hire-me' || lower === 'hire-me' || lower === 'hire me') { COMMANDS['sudo hire-me'](); scroll(); return; }

            var name = lower.split(/\s+/)[0];
            if (COMMANDS[name]) { COMMANDS[name](); }
            else {
                print("<span class='red'>command not found:</span> " + esc(name));
                print(HELP_HINT);
            }
            scroll();
        }

        // ---------- history + input ----------
        var history = [], hi = -1;
        cmd.addEventListener('keydown', function (ev) {
            if (ev.key === 'Enter') {
                var v = cmd.value;
                if (v.trim()) { history.push(v); }
                hi = history.length;
                cmd.value = '';
                run(v);
            } else if (ev.key === 'ArrowUp') {
                ev.preventDefault();
                if (hi > 0) { hi--; cmd.value = history[hi] || ''; setTimeout(function(){cmd.setSelectionRange(cmd.value.length,cmd.value.length);},0); }
            } else if (ev.key === 'ArrowDown') {
                ev.preventDefault();
                if (hi < history.length - 1) { hi++; cmd.value = history[hi] || ''; }
                else { hi = history.length; cmd.value = ''; }
            } else if (ev.key === 'Tab') {
                ev.preventDefault();
                var cur = cmd.value.trim().toLowerCase();
                if (!cur) return;
                var keys = Object.keys(COMMANDS).concat(['sudo hire-me']);
                var m = keys.filter(function (k) { return k.indexOf(cur) === 0; });
                if (m.length === 1) cmd.value = m[0];
            } else if (ev.key === 'l' && ev.ctrlKey) {
                ev.preventDefault(); COMMANDS.clear();
            }
        });

        chips.addEventListener('click', function (ev) {
            var b = ev.target.closest('.chip'); if (!b) return;
            var c = b.getAttribute('data-cmd');
            cmd.value = '';
            run(c);
            focusInput();
        });

        function focusInput() { if (window.innerWidth > 620) cmd.focus(); }
        term.addEventListener('click', function (ev) { if (ev.target.tagName !== 'A') focusInput(); });

        // ---------- matrix rain ----------
        var MATRIX = (function () {
            var c = document.getElementById('matrix'), ctx = c.getContext('2d');
            var raf = null, drops = [], fontSize = 16, cols = 0, active = false;
            var glyphs = 'アカサタナハマヤラワイキシチニヒミリヰウクスツヌフムユルグズヅブヅエケセテネヘメレヱオコソトノホモヨロヲ0123456789ﾊﾐﾋｰｳｼﾅﾓﾆｻﾜｽﾂ'.split('');
            function size() {
                c.width = window.innerWidth; c.height = window.innerHeight;
                cols = Math.floor(c.width / fontSize);
                drops = []; for (var i = 0; i < cols; i++) drops[i] = Math.random() * -100;
            }
            function draw() {
                ctx.fillStyle = 'rgba(5,7,10,0.09)';
                ctx.fillRect(0, 0, c.width, c.height);
                ctx.font = fontSize + 'px monospace';
                for (var i = 0; i < drops.length; i++) {
                    var ch = glyphs[Math.floor(Math.random() * glyphs.length)];
                    var x = i * fontSize, y = drops[i] * fontSize;
                    ctx.fillStyle = Math.random() > 0.975 ? '#7fdfff' : '#3ffb9a';
                    ctx.fillText(ch, x, y);
                    if (y > c.height && Math.random() > 0.975) drops[i] = 0;
                    drops[i] += 0.55;
                }
                raf = requestAnimationFrame(draw);
            }
            return {
                toggle: function () {
                    active = !active;
                    if (active) { size(); c.classList.add('on'); if (!raf) draw(); window.addEventListener('resize', size); }
                    else { c.classList.remove('on'); if (raf) { cancelAnimationFrame(raf); raf = null; } window.removeEventListener('resize', size); ctx.clearRect(0,0,c.width,c.height); }
                    return active;
                }
            };
        })();

        // ---------- sakura petals ----------
        (function () {
            if (reduce) return;
            var host = document.getElementById('sakura');
            var N = window.innerWidth < 620 ? 9 : 16;
            for (var i = 0; i < N; i++) {
                var p = document.createElement('div');
                p.className = 'petal';
                var dur = 7 + Math.random() * 9;
                var size = 8 + Math.random() * 8;
                p.style.left = (Math.random() * 100) + 'vw';
                p.style.width = size + 'px';
                p.style.height = size + 'px';
                p.style.setProperty('--drift', (Math.random() * 180 - 40) + 'px');
                p.style.animationDuration = dur + 's';
                p.style.animationDelay = (-Math.random() * dur) + 's';
                p.style.opacity = 0.45 + Math.random() * 0.4;
                host.appendChild(p);
            }
        })();

        // ---------- boot ----------
        var boot = [
            "<span class='dim'>[    0.000000] tazerOS 6.9.0-phosphor (weeb edition) booting...</span>",
            "<span class='dim'>[    0.041273] CPU: caffeine x8 @ turbo · RAM: never enough</span>",
            "<span class='dim'>[    0.088914] loading modules:</span> <span class='cyan'>burpsuite zaproxy ghidra ffmpeg</span>",
            "<span class='dim'>[    0.132400] mounting /home/tazer ...</span> <span class='green'>ok</span>",
            "<span class='dim'>[    0.170882] starship prompt ...</span> <span class='green'>ok</span>",
            "<span class='dim'>[    0.201337] modprobe kawaii.ko ...</span> <span class='green'>ok</span>",
            "<span class='dim'>[    0.210551] enabling anime subsystem (アニメ) ...</span> <span class='amber'>(this may take a while)</span>",
            "<span class='dim'>[    0.512119] anime subsystem online. MAL synced.</span> <span class='green'>ok</span>",
            "<span class='dim'>[    0.533218] sakura petals: falling</span> <span class='sakura'>🌸 ok</span>",
            "<span class='dim'>[    0.548003] network: bihari.xyz</span> <span class='green'>up</span>",
            "<span class='dim'>[    0.590744] reticulating splines ...</span> <span class='green'>done</span>",
            "<span class='green'>[    0.640210] おかえり、tazer。 welcome home.</span>"
        ];

        var skipped = false;
        function finishBoot() {
            if (skipped) return; skipped = true;
            output.innerHTML = '';
            COMMANDS.neofetch();
            blank();
            print("<span class='dim'>interactive terminal portfolio.</span> " + HELP_HINT);
            print("<span class='dim'>can't be bothered to type? tap a chip below. try</span> <span class='pink'>sudo hire-me</span><span class='dim'>.</span>");
            blank();
            inputline.style.display = 'flex';
            focusInput();
            scroll();
        }

        document.addEventListener('keydown', function once() { if (!skipped && output.children.length) { document.removeEventListener('keydown', once); } });

        if (reduce) {
            boot.forEach(function (l) { print(l); });
            setTimeout(finishBoot, 120);
        } else {
            var i = 0;
            (function step() {
                if (skipped) return;
                if (i < boot.length) { print(boot[i]); i++; setTimeout(step, 78 + Math.random() * 55); }
                else { setTimeout(finishBoot, 320); }
            })();
            // skip on interaction
            var skip = function () { if (i < boot.length) { for (; i < boot.length; i++) print(boot[i]); finishBoot(); } };
            window.addEventListener('keydown', skip, { once: true });
            term.addEventListener('click', skip, { once: true });
        }
    })();
    </script>
</body>
